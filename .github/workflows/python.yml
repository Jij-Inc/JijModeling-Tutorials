name: Notebooks
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        language:
          - ja
          - en

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Set up Node.js for Jupyter Book
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --extra dev --refresh

      - name: Check books
        shell: bash
        env:
          JUPYTER_BASE_URL: http://127.0.0.1:8888
        run: |
          JUPYTER_TOKEN=$(python -c 'import secrets; print(secrets.token_hex(32))')
          export JUPYTER_TOKEN
          echo "::add-mask::$JUPYTER_TOKEN"
          uv run --directory docs/${{ matrix.language }} --locked --extra dev python -m jupyter_server \
            --no-browser --ServerApp.ip=127.0.0.1 --ServerApp.port=8888 --ServerApp.port_retries=0 \
            --Application.log_level=WARN &
          server_pid=$!
          auth="Authorization: token $JUPYTER_TOKEN"
          trap 'curl -fsS --max-time 5 -X POST -H "$auth" "$JUPYTER_BASE_URL/api/shutdown" >/dev/null || kill "$server_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 45 --retry-delay 1 --retry-connrefused --max-time 5 \
            -H "$auth" "$JUPYTER_BASE_URL/api/kernelspecs" >/dev/null

          task check_book_${{ matrix.language }} STRICT=${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }} 2>&1 | tee book-build.log
          if grep -F '⛔' book-build.log; then
            exit 1
          fi

  test_release_scripts:
    name: Test release note TOC and heading updates
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Run TOC round-trip and heading version replacement tests
        run: uv run --locked --extra dev python -m unittest discover -s tests -v

  test_notebook_launch:
    name: Test notebook plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test plugins/*.test.mjs

  disallow_unreleased:
    name: Disallow unreleased release notes
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    if: github.event_name == 'push' && contains(github.ref, 'refs/heads/main') || github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Check unreleased release notes
        run: |
          if [[ -f ./docs/en/releases/unreleased.ipynb || -f ./docs/ja/releases/unreleased.ipynb ]]; then
            echo "[ERROR] Unreleased release notes found!" >&2;
            exit 1;
          fi

      - name: Check release note placeholders
        run: |
          if grep -Fn 'JijModeling X.XX.X' markdowns/*/releases/*.md; then
            echo "[ERROR] Release note placeholder 'JijModeling X.XX.X' found!" >&2;
            exit 1;
          fi

      - name: Check if `unreleased` is not in TOC
        run: uv run --locked --extra dev python scripts/release_toc.py check-no-unreleased

  check_paired_notebooks:
    name: check paired notebooks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --extra dev --refresh

      - name: Check paired notebooks
        run: task check_paired_notebooks
