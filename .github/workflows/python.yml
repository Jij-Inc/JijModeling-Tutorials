name: Notebooks
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        language:
          - ja
          - en

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --extra dev --refresh

      - name: Check books
        run: task check_book_${{ matrix.language }}

  test_release_scripts:
    name: Test release note scripts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Test release note scripts
        run: uv run --locked --extra dev python -m unittest discover -s tests -v

  disallow_unreleased:
    name: Disallow unreleased release notes
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    if: github.event_name == 'push' && contains(github.ref, 'refs/heads/main') || github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Check unreleased release notes
        run: |
          if [[ -f ./docs/en/releases/unreleased.ipynb || -f ./docs/ja/releases/unreleased.ipynb ]]; then
            echo "[ERROR] Unreleased release notes found!" >&2;
            exit 1;
          fi

      - name: Check release note placeholders
        run: |
          if grep -Fn 'JijModeling X.XX.X' markdowns/*/releases/*.md; then
            echo "[ERROR] Release note placeholder 'JijModeling X.XX.X' found!" >&2;
            exit 1;
          fi

      - name: Check if `unreleased` is not in TOC
        run: uv run --locked --extra dev python scripts/release_toc.py check-no-unreleased

  check_paired_notebooks:
    name: check paired notebooks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --extra dev --refresh

      - name: Check paired notebooks
        run: task check_paired_notebooks
