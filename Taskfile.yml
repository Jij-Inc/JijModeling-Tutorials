# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  STRICT: "true"

tasks:
  build_book_ja:
    desc: Build the Japanese book with Jupyter Book 2
    dir: docs/ja
    cmds:
      - uv run --locked --extra dev jupyter-book build --html --execute

  build_book_ja_all:
    desc: Re-execute and rebuild the Japanese book
    cmds:
      - uv run --directory docs/ja --locked --extra dev jupyter-book clean --execute --yes
      - task: build_book_ja

  open_book_ja:
    desc: Serve the Japanese HTML book and open it in a browser
    cmds:
      - task: _open_book
        vars: { LANGUAGE: ja }

  watch_book_ja:
    desc: Preview the Japanese book with live reloading
    dir: docs/ja
    cmds:
      - uv run --locked --extra dev jupyter-book start

  book_ja:
    cmds:
      - task: build_book_ja
      - task: open_book_ja

  book_ja_all:
    cmds:
      - task: build_book_ja_all
      - task: open_book_ja

  check_book_ja:
    desc: Build and execute the Japanese book (STRICT=true enables MyST strict mode)
    dir: docs/ja
    cmds:
      - uv run --locked --extra dev jupyter-book build --html --execute {{if eq .STRICT "true"}}--strict{{end}}

  build_book_en:
    desc: Build the English book with Jupyter Book 2
    dir: docs/en
    cmds:
      - uv run --locked --extra dev jupyter-book build --html --execute

  build_book_en_all:
    desc: Re-execute and rebuild the English book
    cmds:
      - uv run --directory docs/en --locked --extra dev jupyter-book clean --execute --yes
      - task: build_book_en

  open_book_en:
    desc: Serve the English HTML book and open it in a browser
    cmds:
      - task: _open_book
        vars: { LANGUAGE: en }

  watch_book_en:
    desc: Preview the English book with live reloading
    dir: docs/en
    cmds:
      - uv run --locked --extra dev jupyter-book start

  book_en:
    cmds:
      - task: build_book_en
      - task: open_book_en

  book_en_all:
    cmds:
      - task: build_book_en_all
      - task: open_book_en

  check_book_en:
    desc: Build and execute the English book (STRICT=true enables MyST strict mode)
    dir: docs/en
    cmds:
      - uv run --locked --extra dev jupyter-book build --html --execute {{if eq .STRICT "true"}}--strict{{end}}

  _open_book:
    internal: true
    cmds:
      - |
        bash -c '
          set -e
          uv run --locked --extra dev python -m http.server 8000 --bind 127.0.0.1 --directory docs/{{.LANGUAGE}}/_build/html &
          preview_pid=$!
          trap "kill \"$preview_pid\" 2>/dev/null || true" EXIT
          sleep 1
          kill -0 "$preview_pid"
          uv run --locked --extra dev python -m webbrowser http://127.0.0.1:8000/
          wait "$preview_pid"
        '

  create_unreleased_notes:
    desc: Create release notes for the specified version
    cmds:
      - |
        if [[ -f ./docs/en/releases/unreleased.ipynb || -f ./docs/ja/releases/unreleased.ipynb ]]; then
          echo "[ERROR] Unreleased release notes already exist!" >&2;
          exit 1;
        fi
      - uv run --locked --extra dev python scripts/release_toc.py --dry-run ensure-unreleased
      - cp ./templates/release_note_en.ipynb ./docs/en/releases/unreleased.ipynb
      - cp ./templates/release_note_ja.ipynb ./docs/ja/releases/unreleased.ipynb
      - uv run jupytext --sync --use-source-timestamp --execute ./docs/en/releases/unreleased.ipynb
      - uv run jupytext --sync --use-source-timestamp --execute ./docs/ja/releases/unreleased.ipynb
      - uv run --locked --extra dev python scripts/release_toc.py ensure-unreleased

  finalize_release_notes:
    desc: Create release notes for the specified version
    env:
      RELEASE_VERSION: '{{.CLI_ARGS}}'
    cmds:
      - |
        if [[ -z "${RELEASE_VERSION}" ]]; then
          echo "[ERROR] Version argument is required!" >&2;
          exit 1;
        fi
      - uv run --locked --extra dev python scripts/release_toc.py --dry-run finalize "${RELEASE_VERSION}"
      - |
        if [[ ! -f ./docs/en/releases/unreleased.ipynb ]]; then
          cp ./templates/release_note_en.ipynb ./docs/en/releases/unreleased.ipynb;
          uv run jupytext --sync --use-source-timestamp --execute ./docs/en/releases/unreleased.ipynb
        fi

        if [[ ! -f ./docs/ja/releases/unreleased.ipynb ]]; then
          cp ./templates/release_note_ja.ipynb ./docs/ja/releases/unreleased.ipynb;
          uv run jupytext --sync --use-source-timestamp --execute ./docs/ja/releases/unreleased.ipynb
        fi
      - |
        mv ./docs/en/releases/unreleased.ipynb "./docs/en/releases/jijmodeling-${RELEASE_VERSION}.ipynb"
        mv ./markdowns/en/releases/unreleased.md "./markdowns/en/releases/jijmodeling-${RELEASE_VERSION}.md"
      - |
        mv ./docs/ja/releases/unreleased.ipynb "./docs/ja/releases/jijmodeling-${RELEASE_VERSION}.ipynb"
        mv ./markdowns/ja/releases/unreleased.md "./markdowns/ja/releases/jijmodeling-${RELEASE_VERSION}.md"
      - uv run --locked --extra dev python scripts/release_heading.py "${RELEASE_VERSION}" "./markdowns/en/releases/jijmodeling-${RELEASE_VERSION}.md" "./markdowns/ja/releases/jijmodeling-${RELEASE_VERSION}.md"
      - |
        set -e
        for LANG in en ja; do
          uv run --locked --extra dev jupytext --to ipynb --execute --use-source-timestamp \
            --output "./docs/${LANG}/releases/jijmodeling-${RELEASE_VERSION}.ipynb" \
            "./markdowns/${LANG}/releases/jijmodeling-${RELEASE_VERSION}.md"
        done
      - uv run --locked --extra dev python scripts/release_toc.py finalize "${RELEASE_VERSION}"

  check_release_toc:
    desc: Check that no table of contents contains unreleased release notes
    cmds:
      - uv run --locked --extra dev python scripts/release_toc.py check-no-unreleased

  test_release_toc:
    desc: Run the release TOC regression tests
    cmds:
      - uv run --locked --extra dev python -m unittest discover -s tests -v

  sync_unreleased:
    desc: Synchorizes just the `unreleased.ipynb` files with thier respective markdown files.
    cmds:
      - uv run jupytext --sync --use-source-timestamp markdowns/*/releases/unreleased.md

  sync_paired_notebooks:
    desc: Synchronize paired notebooks and markdown files
    cmds:
      - find docs -name "*.ipynb" -not -path "*/*/releases/*" -not -path "*/_build/*" -exec uv run jupytext --sync --use-source-timestamp --execute {} \;

  sync_markdowns_to_notebooks:
    cmds:
      - git diff HEAD --name-only -- 'markdowns/**/*.md' | xargs -L 1 uv run jupytext --sync --use-source-timestamp --execute

  sync_notebooks_to_markdowns:
    cmds:
      - git diff HEAD --name-only -- 'docs/**/*.ipynb' | xargs -L 1 uv run jupytext --sync --use-source-timestamp --execute

  check_paired_notebooks:
    desc: Check that all notebooks and markdown files are properly paired and synchronized
    cmds:
      - |
        #!/bin/bash
        # Check for the existence of corresponding Notebook/Markdown files
        NOTEBOOKS=$(find docs -name "*.ipynb" -not -path "*/_build/*")
        DOCS=$(echo "$NOTEBOOKS" | sed 's|^docs/||; s|.ipynb$||' | sort)
        MDS=$(find markdowns -name "*.md" | sed 's|^markdowns/||; s|.md$||' | sort)
        DIFF=$(diff <(echo "$DOCS") <(echo "$MDS")) || true
        if [ -n "$DIFF" ]; then
          echo "[FAILED] The following notebooks/md files are not paired:"
          echo "$DIFF"
          exit 1
        fi
        # Check for the synchronization between Notebooks and Markdown files
        ERR=0;
        while read -r TARG; do
          LOG=$(uv run jupytext --pre-commit-mode --show-changes --sync $TARG) || true;
          if grep -q "Error:" <<< "$LOG"; then
            echo "$LOG"
            ERR=1
          fi
        done <<< "$NOTEBOOKS";
        if [ $ERR -ne 0 ]; then
          echo "[FAILED] The notebooks/markdowns are not syncrhonized.";
          exit 1;
        fi
        echo "[SUCCESS] All notebooks/markdowns are properly paired and synchronized.";

  textlint:
    desc: Run textlint on Japanese markdown files
    cmds:
      - npm i
      - npx textlint "markdowns/{{.LANG}}/**/*.md"

  textlint_all:
    desc: Run textlint on Japanese markdown files
    cmds:
      - task: textlint_ja
      - task: textlint_en

  textlint_ja:
    desc: Run textlint on Japanese markdown files
    cmds:
      - task: textlint
        vars:
          LANG: ja

  textlint_en:
    desc: Run textlint on English markdown files
    cmds:
      - task: textlint
        vars:
          LANG: en

  textlint_fix:
    desc: Run textlint --fix on markdown files
    cmds:
      - npm i
      - npx textlint --fix "markdowns/{{.LANG}}/**/*.md"
  

  textlint_fix_all:
    desc: Run textlint --fix on markdown files
    cmds:
      - task: textlint_fix_ja
      - task: textlint_fix_en
  
  textlint_fix_ja:
    desc: Run textlint --fix on Japanese markdown files
    cmds:
      - task: textlint_fix
        vars: {LANG: ja}
  
  textlint_fix_en:
    desc: Run textlint --fix on English markdown files
    cmds:
      - task: textlint_fix
        vars: {LANG: en}
